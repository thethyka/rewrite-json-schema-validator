########################################################################################################################
# json-schema-validator migration from 1.5.x to 2.0.0
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.jsonschemavalidator.UpgradeJsonSchemaValidator_1_2
displayName: Migrates from json-schema-validator 1.5.x to 2.0.0
description: >-
  Migrate applications from networknt json-schema-validator 1.5.x to 2.0.0. This recipe handles
  upgrading the dependency version, removing deleted `SchemaValidatorsConfig` setter methods,
  migrating `Set<ValidationMessage>` to `List<ValidationMessage>`, removing the deleted
  `ErrorMessageType` enum and its usages, renaming `JsonSchemaFactory.getInstance(..)` to
  `withDefaultDialect(..)`, and applying all class renames and package relocations.
tags:
  - json-schema-validator
recipeList:
  # Dependency upgrade
  - org.openrewrite.java.jsonschemavalidator.UpgradeJsonSchemaValidator_1_2_Dependencies
  # Behavioral migrations must run before type renames so their UsesType preconditions match old names
  # Remove deleted SchemaValidatorsConfig setter/getter methods
  - org.openrewrite.java.jsonschemavalidator.MigrateSchemaValidatorsConfig
  # Replace Set<ValidationMessage> with List<ValidationMessage>
  - org.openrewrite.java.jsonschemavalidator.MigrateValidationResultTypes
  # Remove ErrorMessageType / CustomErrorMessageType usages (error codes removed in 2.0.0)
  - org.openrewrite.java.jsonschemavalidator.RemoveErrorCodeUsages
  # Method renames must run before type renames (matches old type name JsonSchemaFactory)
  - org.openrewrite.java.jsonschemavalidator.UpgradeJsonSchemaValidator_1_2_MethodChanges
  # Type renames last — all class renames and package relocations
  - org.openrewrite.java.jsonschemavalidator.UpgradeJsonSchemaValidator_1_2_TypeChanges

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.jsonschemavalidator.UpgradeJsonSchemaValidator_1_2_Dependencies
displayName: Upgrade json-schema-validator 1.5.x dependencies to 2.0.0
description: Upgrade networknt json-schema-validator Maven/Gradle dependencies from 1.5.x to 2.0.0.
tags:
  - json-schema-validator
recipeList:
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: com.networknt
      artifactId: json-schema-validator
      newVersion: "2.0.x"

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.jsonschemavalidator.UpgradeJsonSchemaValidator_1_2_TypeChanges
displayName: Update json-schema-validator 1.5.x types to 2.0.0
description: >-
  Update json-schema-validator type names including major class renames and relocations
  into sub-packages (e.g., `JsonSchema` -> `Schema`, `JsonSchemaFactory` -> `SchemaRegistry`,
  `ValidatorTypeCode` -> `keyword.KeywordType`).
tags:
  - json-schema-validator
recipeList:
  # Core class renames (same package)
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.JsonSchema
      newFullyQualifiedTypeName: com.networknt.schema.Schema
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.JsonSchemaFactory
      newFullyQualifiedTypeName: com.networknt.schema.SchemaRegistry
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.ValidationMessage
      newFullyQualifiedTypeName: com.networknt.schema.Error
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.JsonSchemaValidator
      newFullyQualifiedTypeName: com.networknt.schema.Validator
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.ValidationResult
      newFullyQualifiedTypeName: com.networknt.schema.Result
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.JsonNodePath
      newFullyQualifiedTypeName: com.networknt.schema.NodePath
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.JsonSchemaException
      newFullyQualifiedTypeName: com.networknt.schema.SchemaException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.JsonSchemaIdValidator
      newFullyQualifiedTypeName: com.networknt.schema.SchemaIdValidator
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.JsonSchemaRef
      newFullyQualifiedTypeName: com.networknt.schema.SchemaRef

  # Classes relocated to sub-packages
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.JsonMetaSchema
      newFullyQualifiedTypeName: com.networknt.schema.dialect.Dialect
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.JsonMetaSchemaFactory
      newFullyQualifiedTypeName: com.networknt.schema.dialect.DialectRegistry
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.SchemaId
      newFullyQualifiedTypeName: com.networknt.schema.dialect.DialectId
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.ValidatorTypeCode
      newFullyQualifiedTypeName: com.networknt.schema.keyword.KeywordType
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.JsonValidator
      newFullyQualifiedTypeName: com.networknt.schema.keyword.KeywordValidator
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.VocabularyFactory
      newFullyQualifiedTypeName: com.networknt.schema.vocabulary.VocabularyRegistry
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.VersionCode
      newFullyQualifiedTypeName: com.networknt.schema.SpecificationVersionRange

  # SpecVersion.VersionFlag -> SpecificationVersion (flatten hierarchy)
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.SpecVersion.VersionFlag
      newFullyQualifiedTypeName: com.networknt.schema.SpecificationVersion

  # Configuration class renames
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.SchemaValidatorsConfig
      newFullyQualifiedTypeName: com.networknt.schema.SchemaRegistryConfig
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.ValidationContext
      newFullyQualifiedTypeName: com.networknt.schema.SchemaContext

  # Walk-related renames
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.walk.JsonSchemaWalker
      newFullyQualifiedTypeName: com.networknt.schema.walk.Walker

  # Serialization/annotation renames
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.serialization.JsonNodeReader
      newFullyQualifiedTypeName: com.networknt.schema.serialization.NodeReader
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.annotation.JsonNodeAnnotation
      newFullyQualifiedTypeName: com.networknt.schema.annotation.Annotation
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.networknt.schema.annotation.JsonNodeAnnotations
      newFullyQualifiedTypeName: com.networknt.schema.annotation.Annotations

  # Removed type (no replacement)
  # ErrorMessageType - removed, no direct replacement; handled by RemoveErrorCodeUsages recipe

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.jsonschemavalidator.UpgradeJsonSchemaValidator_1_2_MethodChanges
displayName: Update json-schema-validator 1.5.x methods to 2.0.0 equivalents
description: >-
  Rename and update method calls that changed in json-schema-validator 2.0.0. This includes
  factory method changes on `SchemaRegistry` (formerly `JsonSchemaFactory`).
tags:
  - json-schema-validator
recipeList:
  # JsonSchemaFactory.getInstance(SpecVersion.VersionFlag) -> SchemaRegistry.withDefaultDialect(SpecificationVersion)
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.networknt.schema.JsonSchemaFactory getInstance(..)
      newMethodName: withDefaultDialect
